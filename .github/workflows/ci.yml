name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# One job per kind of check, so a failure shows which kind broke.
#
# mise-action caches the tools mise installs. Gems and the built external Go
# programs are cached here; each key changes whenever what it caches would.
env:
  BUNDLE_PATH: vendor/bundle

jobs:
  c-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - uses: jdx/mise-action@v4
    - name: C tests
      run: mise run test-c

  ruby-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: jdx/mise-action@v4
    - uses: actions/cache@v6
      with:
        path: vendor/bundle
        key: gems-${{ runner.os }}-${{ hashFiles('Gemfile.lock', 'mise.toml') }}
    - name: Install gems
      run: bundle install
    - name: Ruby tests
      run: mise run test-ruby

  smoke-matches:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - uses: jdx/mise-action@v4
    - uses: actions/cache@v6
      with:
        path: vendor/bundle
        key: gems-${{ runner.os }}-${{ hashFiles('Gemfile.lock', 'mise.toml') }}
    # The installer skips downloading and building when it finds its own
    # completed install, so a cache hit skips both.
    - uses: actions/cache@v6
      with:
        path: .local/evo-tools
        key: evo-tools-${{ runner.os }}-${{ hashFiles('scripts/install-external-tools.sh', 'scripts/external-tools.txt', 'scripts/patches/**') }}
    - name: Setup experiments
      run: mise run setup-experiments
    - name: Check external programs
      run: mise run doctor
    - name: Refereed matches
      run: mise run smoke
