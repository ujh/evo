name: CI

# Every pull request runs the checks, including one stacked on another
# branch; pushes run them only on main, since a pushed branch with a pull
# request already runs them through it.
on:
  push:
    branches: [ "main" ]
  pull_request:

# One job per kind of check, so a failure shows which kind broke, and one
# per smoke check, so they run side by side. Each job has a time limit a few
# times its usual length, so a hang (a bot never killed, a pipe left open)
# fails instead of running for GitHub's default of 6 hours.
#
# mise-action caches the tools mise installs. Gems and the built external Go
# programs are cached here; each key changes whenever what it caches would.
env:
  BUNDLE_PATH: vendor/bundle

jobs:
  c-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - uses: jdx/mise-action@v5
    - name: C tests
      run: mise run test-c

  ruby-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
    - uses: jdx/mise-action@v5
    # Cached gems and tools are compiled, so they are only valid on the runner
    # image that built them. ImageOS is not readable in a cache key directly.
    - id: image
      run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      with:
        path: vendor/bundle
        key: gems-${{ runner.os }}-${{ steps.image.outputs.os }}-${{ hashFiles('Gemfile.lock', 'mise.toml') }}
    - name: Install gems
      run: bundle install
    - name: Ruby tests
      run: mise run test-ruby

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: [matches, controller, arena, patches, agreement]
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - uses: jdx/mise-action@v5
    # Cached gems and tools are compiled, so they are only valid on the runner
    # image that built them. ImageOS is not readable in a cache key directly.
    - id: image
      run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      with:
        path: vendor/bundle
        key: gems-${{ runner.os }}-${{ steps.image.outputs.os }}-${{ hashFiles('Gemfile.lock', 'mise.toml') }}
    # The installer skips downloading and building when it finds its own
    # completed install, so a cache hit skips both.
    - uses: actions/cache@v6
      with:
        path: .local/evo-tools
        key: evo-tools-${{ runner.os }}-${{ steps.image.outputs.os }}-${{ hashFiles('scripts/install-external-tools.sh', 'scripts/external-tools.txt', 'scripts/patches/**') }}
    - name: Setup experiments
      run: mise run setup-experiments
    - name: Check external programs
      run: mise run doctor
    - name: Smoke check
      run: mise run smoke-${{ matrix.check }}
