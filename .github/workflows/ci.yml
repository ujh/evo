name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# One job per kind of check, so a failure shows which kind broke.
jobs:
  c-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - uses: jdx/mise-action@v4
    - name: C tests
      run: mise run test-c

  ruby-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: jdx/mise-action@v4
    - name: Install gems
      run: bundle install
    - name: Ruby tests
      run: mise run test-ruby

  smoke-matches:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - uses: jdx/mise-action@v4
    - name: Setup experiments
      run: mise run setup-experiments
    - name: Check external programs
      run: mise run doctor
    - name: Refereed matches
      run: mise run smoke
