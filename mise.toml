[tools]
ruby = "4.0.7"
java = "temurin-21.0.11+10.0.LTS"
jq = "1.8.2"

[env]
_.path = ".local/evo-tools/current/bin"

[tasks.setup]
description = "Initialize submodules, install pinned tools and Ruby gems, then build"
run = ["sh scripts/ensure-submodules.sh", "bundle install", { task = "build" }]

[tasks.setup-experiments]
description = "Install the pinned external Go programs and GoGui locally"
run = [{ task = "setup" }, "sh scripts/install-external-tools.sh"]

[tasks.mirror-external-tools]
description = "Upload the external tool archives to the GitHub release the installer downloads from"
run = "sh scripts/mirror-external-tools.sh"

[tasks.build]
description = "Build the C programs"
run = "make"

[tasks.test]
description = "Run the C and Ruby test suites"
depends = ["test-c", "test-ruby"]

[tasks.test-c]
description = "Run the C test suite"
run = "make test"

[tasks.test-ruby]
description = "Run the Ruby tests (tournament runner and PR check scripts)"
run = "bundle exec ruby -e 'Dir[\"test/**/*_test.rb\"].sort.each { |f| require File.expand_path(f) }'"

[tasks.verify]
description = "Run tests and check the programs needed for experiments"
run = [{ task = "test" }, { task = "doctor" }, { task = "smoke" }]

[tasks.smoke]
description = "Play one refereed GoGui match with each external opponent and Evo"
run = "sh scripts/smoke-external-tools.sh"

[tasks.clean]
description = "Remove generated C build and test files"
run = "make clean"

[tasks.doctor]
description = "Check external programs needed to run experiments"
run = "sh scripts/check-runtime-dependencies.sh"

[tasks.run]
description = "Run or resume an experiment: mise run run NAME [CONCURRENCY [one-generation]]"
depends = ["build", "doctor"]
run = "./runner"
raw = true

[tasks.new-experiment]
description = "Create an experiment without the prompts: mise run new-experiment NAME --board-size 9 ... (without arguments it lists the options)"
run = "./new-experiment"
raw = true

[tasks.stats]
description = "Show experiment statistics: mise run stats NAME [--watch | --csv]"
run = "./stats"
raw = true

[tasks.example]
description = "Open the bundled network self-play example in GoGui"
depends = ["build", "doctor"]
run = "sh scripts/run-example.sh"
raw = true

[tasks.pr-checks]
description = "Wait for a PR's CI and fail unless every check passed on HEAD: mise run pr-checks PR"
run = "sh scripts/pr-checks.sh"
